# ===========================================================================
# NauVi CI Pipeline — GitHub Actions
# Chạy khi push hoặc pull request vào nhánh chính (main)
# ===========================================================================
name: NauVi CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Quyền tối thiểu cho GITHUB_TOKEN
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Quét bí mật bằng gitleaks
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 🔐 Quét bí mật (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tải toàn bộ lịch sử commit để quét kỹ

      - name: Chạy gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Build & Test .NET 8 (xUnit)
  # ─────────────────────────────────────────────────────────────────────────
  dotnet-test:
    name: 🧪 .NET 8 Build & Test
    runs-on: ubuntu-latest
    needs: secret-scan

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache gói NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --no-restore --configuration Release

      - name: Chạy xUnit tests (34 test cases)
        run: dotnet test tests/FoodWiseAi.Tests/FoodWiseAi.Tests.csproj --no-build --configuration Release --verbosity normal
        env:
          # Đảm bảo test KHÔNG gọi Gemini thật hay MongoDB thật
          AI_MODE: mock
          GEMINI_API_KEY: ""
          AiImageService__BaseUrl: "http://localhost:9999"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Test Python AI Service (FastAPI + pytest)
  # ─────────────────────────────────────────────────────────────────────────
  python-test:
    name: 🐍 Python AI Service Test
    runs-on: ubuntu-latest
    needs: secret-scan

    defaults:
      run:
        working-directory: ai_service

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai_service/requirements.txt

      - name: Cài đặt dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Chạy pytest (chế độ AI_MODE=mock)
        run: pytest test_main.py -v
        env:
          AI_MODE: mock
          GEMINI_API_KEY: ""

  # ─────────────────────────────────────────────────────────────────────────
  # Job 4: Kiểm tra build Docker (chỉ build, không push)
  # ─────────────────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Check
    runs-on: ubuntu-latest
    needs: [dotnet-test, python-test]

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Build Docker images (không push)
        run: docker compose build
        env:
          AI_MODE: mock
          GEMINI_API_KEY: ""
